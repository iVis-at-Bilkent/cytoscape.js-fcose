<!DOCTYPE>

<html>

  <head>
    <title>cytoscape-fcose.js demo</title>

      <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
      
      <!-- Bootstrap, popper, jQuery and filesaver - for demo purpose only -->
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
      <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>      
      <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">       

      <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

      <style>
        body {
          font-family: helvetica neue, helvetica, liberation sans, arial, sans-serif;
          font-size: 14px;
        }

        #cy {
          position: relative;
          width: auto;
          height: 90%;
          z-index: 999;
          margin-left: 290px;
          right: 0px;
        }

        h1 {
          opacity: 1;
          color: #555;
          font-size: 15px;
          font-weight: bold;
          padding-top: 5px;
        }
                
        /* The sidepanel menu */
        .sidepanel {
          height: auto; /* Specify a height */
          width: 290px; /* 0 width - change this with JavaScript */
          position: absolute; /* Stay in place */
          z-index: 1000; /* Stay on top */
          float: left;
          top: auto;
          left: 0;
          background-color: #b7ffff; /* Black*/
          overflow-x: hidden; /* Disable horizontal scroll */
          padding-top: 10px; /* Place content 10px from the top */
          padding-bottom: 10px; /* Place content 10px from the bottom */
          transition: 0s; /* 0.5 second transition effect to slide in the sidepanel */
        }

        table{
          margin-left: 4px;
          margin-right: auto;
          table-layout: fixed;
        }        
        
        /* The sidepanel links */
        table td {
          padding: 0px 8px 8px 8px;
          text-decoration: none;
          font-size: 13px;
          color: #555;
          transition: 0.3s;
          vertical-align: middle;          
        }

        /* Style the button that is used to open the sidepanel */
        .button {
          font-size: 15px;
          color: #555;
          cursor: pointer;
          background-color: #b7ffff;
          padding: 5px 10px;
          border: none;
          margin-bottom: 5px;
        }
        
        .textField {
          padding-left: 5px;
        }
        
        .checkbox {
          margin-left: 0px;
        }        

        .button:hover {
          background-color: #0f0;
        }
        
        .btn-group-sm>.btn, .btn-sm { 
          font-size: 13px;
          background-color: #7d8991;
          border-color: #7d8991;
        }
        
        .btn-primary:hover, .btn-primary:focus, .btn-primary:active, .btn-primary.active, .open>.dropdown-toggle.btn-primary {
            color: #fff;
            background-color: #60717d;
            border-color: #60717d; /*set the color you want here*/
        }  
        
        .btn-outline-primary:hover, .btn-outline-primary:focus, .btn-outline-primary:active, .btn-outline-primary.active, .open>.dropdown-toggle.btn-primary {
            color: #fff;
            background-color: #60717d;
            border-color: #60717d; /*set the color you want here*/
        }         
        
        .form-control-sm { 
          font-size: 13px
        }

        .custom-select-sm {
          font-size: 13px
        } 
        
        .custom-control-label {
          padding-top: 2px;
        }
        
        .custom-control-input:checked~.custom-control-label::before {
            color: #fff;
            border-color: #7d8991;
            background-color: #7d8991;
        }   
      </style>

      <script>
        document.addEventListener('DOMContentLoaded', function(){

          var cy = window.cy = cytoscape({
            container: document.getElementById('cy'),
            
            ready: function(){
              let layoutUtilities = this.layoutUtilities({
                desiredAspectRatio: this.width()/this.height()
              });              
              this.nodes().forEach(function(node){
                let size = Math.random()*120+30;
                node.css("width", size);
                node.css("height", size);
              });
              this.layout({name: 'fcose', animationEasing: 'ease-out'}).run();
            },
            
            // demo your layout
            layout: {
              name: 'grid'
            },

            style: [
              {
                selector: 'node',
                style: {
                  'background-color': '#2B65EC'                 
                }
              },
              
              {
              selector: ':parent',
                style: {
                  'background-opacity': 0.333,
                  'border-color': '#2B65EC'
                }
              },

              {
                selector: 'edge',
                style: {
                  'line-color': '#2B65EC'
                }
              },
              
              {
                selector: 'node:selected',
                style: {
                  'background-color': '#F08080',
                  'border-color': 'red'
                }
              },
              
              {
                selector: 'edge:selected',
                style: {
                  'line-color': '#F08080'
                }
              }                 
            ],  
            
            elements: [{ group:'nodes', data:{ id: 'n0'}},
                    { group:'nodes', data:{ id: 'n1'}},
                    { group:'nodes', data:{ id: 'n2'}},
                    { group:'nodes', data:{ id: 'n3'}},
                    { group:'nodes', data:{ id: 'n4'}},

                    { group:'nodes', data:{ id: 'n10'}},

                    { group:'nodes', data:{ id: 'n12'}},

                    { group:'nodes', data:{ id: 'n15'}},
                    { group:'nodes', data:{ id: 'n16'}},

                    { group:'nodes', data:{ id: 'n18'}},
                    { group:'nodes', data:{ id: 'n19'}},
                    { group:'nodes', data:{ id: 'n20'}},
                    { group:'nodes', data:{ id: 'n21'}},
                    { group:'nodes', data:{ id: 'n22'}},
                    { group:'nodes', data:{ id: 'n23'}},
                    { group:'nodes', data:{ id: 'n24'}},
                    { group:'nodes', data:{ id: 'n25'}},
                    { group:'nodes', data:{ id: 'n26'}},
                    { group:'nodes', data:{ id: 'n40'}},
                    { group:'nodes', data:{ id: 'n41'}},
                    { group:'nodes', data:{ id: 'n42'}}, //
                    { group:'nodes', data:{ id: 'n27'}},
                    { group:'nodes', data:{ id: 'n28'}},
                    { group:'nodes', data:{ id: 'n29'}},
                    { group:'nodes', data:{ id: 'n30'}},
                    { group:'nodes', data:{ id: 'n31'}},
                    { group:'nodes', data:{ id: 'n32'}},
                    { group:'nodes', data:{ id: 'n33'}},
                    { group:'nodes', data:{ id: 'n34'}},
                    { group:'nodes', data:{ id: 'n35'}},
                    { group:'nodes', data:{ id: 'n36'}},
                    { group:'nodes', data:{ id: 'n37'}},
                    { group:'nodes', data:{ id: 'n38'}},
                    { group:'nodes', data:{ id: 'n39'}}, //
                    { group:'nodes', data:{ id: 'n43'}},
                    { group:'nodes', data:{ id: 'n44'}},
                    { group:'nodes', data:{ id: 'n45'}},
                    { group:'nodes', data:{ id: 'n46'}},
                    { group:'nodes', data:{ id: 'n47'}},
                    { group:'nodes', data:{ id: 'n48'}},
                    { group:'nodes', data:{ id: 'n49'}},
                    { group:'edges', data:{ id: 'e0', source: 'n0', target: 'n1'} },
                    { group:'edges', data:{ id: 'e1', source: 'n0', target: 'n2'} },
                    { group:'edges', data:{ id: 'e2', source: 'n0', target: 'n3'} },
                    { group:'edges', data:{ id: 'e3', source: 'n1', target: 'n4'} },
                    { group:'edges', data:{ id: 'e4', source: 'n1', target: 'n5'} },
                    { group:'edges', data:{ id: 'e5', source: 'n1', target: 'n6'} },

                    { group:'edges', data:{ id: 'e30', source: 'n29', target: 'n32'} },
                    { group:'edges', data:{ id: 'e31', source: 'n29', target: 'n33'} },
                    { group:'edges', data:{ id: 'e32', source: 'n29', target: 'n34'} },
                    { group:'edges', data:{ id: 'e33', source: 'n31', target: 'n35'} },

                    { group:'edges', data:{ id: 'e42', source: 'n43', target: 'n45'} },
                    { group:'edges', data:{ id: 'e43', source: 'n44', target: 'n46'} },
                    { group:'edges', data:{ id: 'e44', source: 'n45', target: 'n47'} },
                    { group:'edges', data:{ id: 'e45', source: 'n46', target: 'n48'} },
                    { group:'edges', data:{ id: 'e46', source: 'n47', target: 'n49'} }                
                   ]
          });          
          
          document.getElementById("randomizeButton").addEventListener("click", function(){
            var layout = cy.layout({
              name: 'random',
              animate: true,
              animationDuration: 1000
            });
            
            layout.run();        
          });          
          
          document.getElementById("fcoseButton").addEventListener("click", function(){
            let qualityItem = document.getElementById("quality");
            let treeDirection = document.getElementById("treeConstraintDirection");
            var layout = cy.layout({
              name: 'fcose',
              quality: qualityItem.options[qualityItem.selectedIndex].value,
              randomize: !(document.getElementById("randomize").checked),
              animate: document.getElementById("animate").checked,
              animationEasing: 'ease-out',
              fit: document.getElementById("fit").checked,
              step:"all",
              treeConstraint: {direction: treeDirection.options[treeDirection.selectedIndex].value, gap: parseFloat(document.getElementById("treeConstraintGap").value)}
            });
            
            layout.run();        
          });
          
        });
      </script>
  </head>

  <body>
          <h1 class="ml-2">cytoscape-fcose demo (tree constraint)</h1>
          <div style='width: 300px; position: absolute;'>
            <button id="randomizeButton" class="btn btn-primary btn-sm mb-2 ml-2">Randomize</button>&nbsp &nbsp
            <button id="fcoseButton" class="btn btn-primary btn-sm mb-2 ml-2">fCoSE</button>
          
            <div id="mySidepanel" class="sidepanel">
              <table>
                <tr>
                  <td><span class="add-on layout-text" title="Quality of the layout"> Quality </span></td>
                  <td>            
                    <select id="quality" class='custom-select custom-select-sm'>
                      <option value="draft">draft</option>
                      <option value="default" selected="">default</option>
                      <option value="proof">proof</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><span class="add-on layout-text" title="Whether to enable incremental mode"> Incremental </span></td>
                  <td>        
                    <div class="custom-control custom-control-inline custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="randomize" name="incremental">
                      <label class="custom-control-label" for="randomize"></label>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td><span class="add-on layout-text" title="Whether to perform animation after layout"> Animate </span></td>
                  <td>
                    <div class="custom-control custom-control-inline custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="animate" name="animate" checked>
                      <label class="custom-control-label" for="animate"></label>
                    </div>                  
                  </td>
                </tr>
                <tr>
                  <td><span class="add-on layout-text" title="Whether to fit the viewport to the repositioned nodes"> Fit </span></td>
                  <td>
                    <div class="custom-control custom-control-inline custom-checkbox">
                      <input type="checkbox" class="custom-control-input" id="fit" name="fit" checked>
                      <label class="custom-control-label" for="fit"></label>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td><span class="add-on layout-text" title="Tree constraint - direction"> Tree constraint - direction </span></td>
                  <td>            
                    <select id="treeConstraintDirection" class='custom-select custom-select-sm'>
                      <option value="T-B" selected="">T-B</option>
                      <option value="B-T">B-T</option>
                      <option value="L-R">L-R</option>
                      <option value="R-L">R-L</option>
                    </select>
                  </td>
                </tr>              
                <tr>
                  <td><span class="add-on layout-text" title="Minimum gap between layers"> Tree constraint - gap </span></td>
                  <td><input id="treeConstraintGap" class="textField form-control form-control-sm" type="text" value="200" maxlength=5 size="5"></td>
                </tr>             
              </table>

            </div>
          </div>
          <div id="cy"></div>

  </body>

</html>
